name: ShopCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Cài đặt dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Cài đặt Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: ./frontend

    - name: Chạy Vitest Tests
      run: npx vitest run --config vitest.config.ts
      working-directory: ./frontend

    - name: Chạy Playwright E2E Tests
      run: npm run test:e2e
      working-directory: ./frontend

    - name: Debug - Kiểm tra thư mục
      run: ls -la ./frontend/playwright-report ./frontend/test-results || echo "Không tìm thấy"

    # ==================== UPLOAD ====================
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./frontend/playwright-report/
        retention-days: 14

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./frontend/test-results/
        retention-days: 7