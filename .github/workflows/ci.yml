name: ShopCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    # Thiết lập mặc định: Mọi câu lệnh bên dưới sẽ được chạy bên trong thư mục frontend
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json' # Chỉ định đúng file lock nằm trong frontend

    - name: Cài đặt các thư viện (Dependencies)
      run: npm ci --legacy-peer-deps

    - name: Cài đặt môi trường trình duyệt cho Playwright
      run: npx playwright install --with-deps

    - name: 1. Chạy Unit & Integration Test (Vitest)
      run: npx vitest run --config vitest.config.ts

    - name: 2. Chạy E2E Test (Playwright)
      run: npm run test:e2e

    - name: Tải báo cáo kiểm thử lên GitHub Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/ # Trỏ đúng đường dẫn báo cáo nằm trong thư mục frontend
        retention-days: 7