name: ShopCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Cài đặt dependencies
      run: npm ci

    - name: Cài đặt Playwright Browsers
      run: npx playwright install --with-deps

    - name: Chạy Vitest Tests
      run: npx vitest run --config vitest.config.ts

    - name: Chạy Playwright E2E Tests
      run: npm run test:e2e

    - name: Debug - Kiểm tra thư mục
      run: ls -la playwright-report test-results

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/**
          test-results/**
        retention-days: 14