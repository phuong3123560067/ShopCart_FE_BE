name: ShopCart Backend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    # Thiết lập thư mục làm việc mặc định cho job này
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Biên dịch project (Compile)
      run: mvn clean compile

    - name: Chạy Unit & Integration Tests
      # Lệnh này sẽ chạy test và kích hoạt JaCoCo tạo báo cáo
      run: mvn test

    - name: Kiểm tra báo cáo JaCoCo (Debug)
      run: ls -la target/site/jacoco/

    # ==================== PHẦN QUAN TRỌNG CHO MÔN KIỂM THỬ ====================
    - name: Upload Test Report (JUnit)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: ./backend/target/surefire-reports/
        retention-days: 7

    - name: Upload Coverage Report (JaCoCo)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: ./backend/target/site/jacoco/
        retention-days: 14

    # (Tùy chọn) In kết quả coverage ra log của GitHub Actions
    - name: Hiển thị Coverage Summary
      run: |
        echo "Kiểm tra file index.html trong artifact để xem chi tiết độ bao phủ."